name: Preparar lockfile Angular 22

on:
  push:
    branches:
      - migration/angular22-audit-fix

permissions:
  contents: write

jobs:
  regenerar-y-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama de migración
        uses: actions/checkout@v4
        with:
          ref: migration/angular22-audit-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js compatible con Angular 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Instalar npm fijado por el proyecto
        run: npm install --global npm@11.12.1

      - name: Regenerar package-lock.json desde package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Guardar lockfile actualizado en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "El lockfile no presenta cambios."
          else
            git commit -m "build: regenerar lockfile para Angular 22"
            git push origin HEAD:migration/angular22-audit-fix
          fi

      - name: Instalar exactamente lo bloqueado
        run: npm ci

      - name: Pruebas unitarias
        run: npx ng test --watch=false

      - name: Compilación de producción
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Guardar informe de auditoría
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Publicar informe de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-angular22
          path: npm-audit.json
          if-no-files-found: ignore
